<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EveryEve</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Holiday gifts made to order for Thanksgiving, Hanukkah, Christmas, Kwanzaa, New Year's Eve and every celebration in between.">
<!-- Add <link rel="canonical" href="https://YOUR-HOSTNAME/"> here once the hostname is chosen. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Gloock&family=Caveat:wght@700&family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap">
<style>
/* Layout: a conventional storefront theme. Announcement bar, header, banner, collection list,
   featured collections, image-with-text, multicolumn, footer. One light color scheme. */
:root {
  color-scheme: light;
  --bg: #FFFFFF; --text: #121212; --body: rgba(18,18,18,.75); --soft: rgba(18,18,18,.55);
  --line: rgba(18,18,18,.12); --media: #F3F3F3; --banner: #EFE6DA; --scheme2: #F4F1EC;
  --btn: #121212; --btn-text: #FFFFFF; --badge-warn: #8A5A00; --ok: #2E7D4F;
  --font: Assistant, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box }
[hidden] { display: none !important }
html { -webkit-text-size-adjust: 100% }
body { margin: 0; background: var(--bg); color: var(--body); font: 400 16px/1.8 var(--font); letter-spacing: .6px }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--bg) }
img, svg { max-width: 100% }
a { color: inherit }
button, input, select { font: inherit; letter-spacing: inherit; color: inherit }
h1, h2, h3 { color: var(--text); font-weight: 400; letter-spacing: .6px; line-height: 1.3; margin: 0 }
h1 { font-size: 40px } h2 { font-size: 24px } h3 { font-size: 18px }
:focus-visible { outline: 2px solid rgba(18,18,18,.5); outline-offset: 3px }
.page-width { max-width: 1200px; margin: 0 auto; padding-left: max(50px, env(safe-area-inset-left, 0px)); padding-right: max(50px, env(safe-area-inset-right, 0px)) }
.section { padding-block: 36px }
.button { display: inline-flex; align-items: center; justify-content: center; min-height: 45px; padding: 0 30px; border: 0; background: var(--btn); color: var(--btn-text); font-size: 15px; letter-spacing: 1px; text-decoration: none; cursor: pointer }
.button:hover { box-shadow: 0 0 0 2px var(--btn) }
.button--secondary { background: transparent; color: var(--text); box-shadow: inset 0 0 0 1px var(--text) }
.button--secondary:hover { box-shadow: inset 0 0 0 2px var(--text) }
.button[disabled] { opacity: .5; cursor: not-allowed }
.link { color: var(--text); text-underline-offset: 3px }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0) }

/* announcement + header */
.announcement { border-bottom: 1px solid var(--line); text-align: center; font-size: 13px; letter-spacing: 1px; color: var(--text); padding: 10px 16px }
.header-wrapper { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); border-bottom: 1px solid var(--line) }
.header { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 20px; padding-block: 18px }
.logo { display: flex; align-items: center; gap: 8px; color: var(--text); text-decoration: none; font-size: 26px; font-weight: 700; letter-spacing: .2px; line-height: 1 }
.menu { display: flex; gap: 4px; justify-self: start; flex-wrap: wrap }
.menu > a, .menu summary { display: block; padding: 6px 12px; color: var(--soft); text-decoration: none; font-size: 15px; cursor: pointer; list-style: none }
.menu > a:hover, .menu summary:hover, .menu a[aria-current="page"] { color: var(--text); text-decoration: underline; text-underline-offset: 3px }
.menu summary::-webkit-details-marker { display: none }
.menu details { position: relative }
.menu details > div { position: absolute; top: 100%; left: 0; background: var(--bg); border: 1px solid var(--line); padding: 14px 0; min-width: 220px; z-index: 5; box-shadow: 0 4px 12px rgba(0,0,0,.06) }
.menu details a { display: block; padding: 6px 20px; color: var(--soft); text-decoration: none; font-size: 15px }
.menu details a:hover { color: var(--text); text-decoration: underline }
.icons { display: flex; gap: 6px; align-items: center }
.icon-btn { position: relative; border: 0; background: none; width: 44px; height: 44px; display: grid; place-items: center; cursor: pointer; color: var(--text) }
.icon-btn svg { width: 22px; height: 22px }
.bubble { position: absolute; bottom: 6px; right: 4px; min-width: 18px; height: 18px; border-radius: 50%; background: var(--btn); color: #fff; font-size: 11px; line-height: 18px; text-align: center; letter-spacing: 0 }
.burger { display: none }
.searchbar { border-top: 1px solid var(--line); padding-block: 14px }
.searchbar .field { position: relative; max-width: 740px; margin: 0 auto }
.field input, .field select { width: 100%; min-height: 45px; padding: 0 16px; border: 0; box-shadow: inset 0 0 0 1px rgba(18,18,18,.55); background: var(--bg); color: var(--text); border-radius: 0 }
.field input:focus, .field select:focus { box-shadow: inset 0 0 0 2px rgba(18,18,18,.75); outline: 0 }
.mobile-nav { border-top: 1px solid var(--line); padding-block: 10px 18px }
.mobile-nav a { display: block; padding: 10px 0; color: var(--text); text-decoration: none; font-size: 18px }
.mobile-nav .sub a { font-size: 15px; color: var(--soft); padding: 6px 0 6px 14px }

/* banner */
.banner { background: var(--banner) }
.banner .page-width { display: grid; grid-template-columns: 1.1fr 1fr; align-items: center; gap: 30px; min-height: 480px; padding-block: 40px }
.banner h1 { font-size: 52px; line-height: 1.15 }
.banner p { font-size: 18px; margin: 14px 0 28px; max-width: 44ch }
.collage { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; max-width: 520px; justify-self: end; width: 100% }
.collage a { display: block; aspect-ratio: 1; background: var(--bg); overflow: hidden; max-width: 100% }
.collage svg, .collage img, .media img, .gallery img, .thumbs img { width: 100%; height: 100%; object-fit: cover; display: block }
.noimg { display: grid; place-items: center; width: 100%; height: 100%; padding: 16px; text-align: center; color: var(--soft); font-size: 14px }
.banner .btns { display: flex; gap: 12px; flex-wrap: wrap }

/* titles */
.title-wrapper { display: flex; justify-content: space-between; align-items: end; gap: 16px; margin-bottom: 26px; flex-wrap: wrap }
.title-wrapper p { margin: 4px 0 0; max-width: 60ch }

/* collection list */
.collections { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px }
.collection-card { text-decoration: none; color: var(--text); display: grid; gap: 10px; min-width: 0 }
.collection-card .media { aspect-ratio: 1; max-width: 100%; display: block; overflow: hidden }
.collection-card .media svg { width: 100%; height: 100%; display: block; transition: transform .5s ease }
.collection-card:hover .media svg { transform: scale(1.04) }
.collection-card h3 { font-size: 18px; display: flex; gap: 8px; align-items: center }
.collection-card small { display: block; color: var(--soft); font-size: 13px; line-height: 1.4 }
.arrow { width: 14px; height: 10px; transition: transform .2s }
.collection-card:hover .arrow { transform: translateX(4px) }

/* product grid + card */
.product-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 30px 16px; list-style: none; padding: 0; margin: 0 }
.card { display: grid; gap: 6px; align-content: start; min-width: 0; position: relative }
.card .media { position: relative; display: block; aspect-ratio: 1; max-width: 100%; background: var(--media); overflow: hidden }
.card .media svg { width: 100%; height: 100%; display: block; transition: transform .5s ease }
.card:hover .media svg, .card:hover .media img { transform: scale(1.03) }
.card .media img { transition: transform .5s ease }
.card .media .alt { position: absolute; inset: 0; opacity: 0; transition: opacity .4s }
.card:hover .media .alt { opacity: 1 }
.badge { position: absolute; left: 10px; bottom: 10px; z-index: 2; border-radius: 40px; padding: 2px 12px; font-size: 12px; letter-spacing: 1px; background: var(--btn); color: #fff; line-height: 1.8 }
.badge.light { background: #fff; color: var(--text); border: 1px solid var(--line) }
.card__title { font-size: 15px; color: var(--text); text-decoration: none; line-height: 1.4; margin-top: 8px }
.card__title::after { content: ""; position: absolute; inset: 0; z-index: 1 }
.card:hover .card__title { text-decoration: underline; text-underline-offset: 3px }
.price { font-size: 15px; letter-spacing: 1px; color: var(--text) }
.price small { font-size: 13px; color: var(--soft); letter-spacing: .6px }
.center { text-align: center; margin-top: 34px }

/* image with text */
.iwt { background: var(--scheme2) }
.iwt .page-width { display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 0 }
.iwt .media { background: var(--banner); aspect-ratio: 1; max-width: 100%; display: grid; place-items: center; padding: 30px }
.iwt .media { padding: 0; background: var(--media) }
.iwt .content { padding: 40px 50px }
.iwt .eyebrow, .eyebrow { font-size: 13px; letter-spacing: 1.3px; text-transform: uppercase; color: var(--soft) }
.iwt h2 { font-size: 32px; margin: 6px 0 14px }

/* multicolumn */
.multicolumn { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 30px; text-align: center }
.multicolumn svg { width: 40px; height: 40px; color: var(--text) }
.multicolumn h3 { margin: 10px 0 6px }
.multicolumn p { margin: 0 auto; max-width: 34ch; font-size: 15px }

/* collection page */
.collection-hero { padding-block: 40px 10px }
.collection-hero p { max-width: 70ch; margin: 8px 0 0 }
.facets { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: center; padding-block: 16px; border-bottom: 1px solid var(--line); margin-bottom: 28px; font-size: 14px }
.facets label { display: flex; align-items: center; gap: 10px; color: var(--soft) }
.facets select { min-height: 40px; min-width: 150px; padding: 0 12px; border: 0; box-shadow: inset 0 0 0 1px var(--line); background: var(--bg); color: var(--text) }
.facets .count { margin-left: auto; color: var(--soft) }
.empty { padding: 50px 0; text-align: center }

/* product page */
.product { display: grid; grid-template-columns: 1.15fr 1fr; gap: 50px; padding-block: 36px 50px; align-items: start }
.product .gallery { display: grid; gap: 10px; min-width: 0 }
.product .gallery .main { aspect-ratio: 1; background: var(--media); max-width: 100% }
.product .gallery .main svg { width: 100%; height: 100%; display: block }
.thumbs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px }
.thumbs button { aspect-ratio: 1; border: 0; padding: 0; background: var(--media); cursor: pointer; box-shadow: inset 0 0 0 1px transparent }
.thumbs button[aria-current="true"] { box-shadow: 0 0 0 1px var(--text) }
.thumbs svg { width: 100%; height: 100%; display: block }
.product .info { display: grid; gap: 16px; position: sticky; top: 100px; min-width: 0 }
.product h1 { font-size: 40px; line-height: 1.2 }
.product .price { font-size: 18px }
.tax { font-size: 13px; color: var(--soft); margin-top: -8px }
fieldset { border: 0; padding: 0; margin: 0 }
legend { font-size: 14px; color: var(--text); margin-bottom: 8px; padding: 0 }
.pills { display: flex; flex-wrap: wrap; gap: 8px }
.pill { border: 1px solid rgba(18,18,18,.55); background: var(--bg); color: var(--text); border-radius: 40px; padding: 6px 20px; font-size: 14px; cursor: pointer; line-height: 1.6 }
.pill[aria-pressed="true"] { background: var(--btn); color: #fff; border-color: var(--btn) }
.pill:hover { border-color: var(--text) }
.qty { display: inline-flex; align-items: center; box-shadow: inset 0 0 0 1px rgba(18,18,18,.55); min-height: 45px; width: 140px }
.qty button { flex: 1; border: 0; background: none; height: 45px; cursor: pointer; font-size: 18px }
.qty span { min-width: 30px; text-align: center; color: var(--text) }
.buy { display: grid; gap: 10px }
.delivery { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; background: var(--scheme2); font-size: 14px; line-height: 1.6 }
.delivery svg { width: 24px; height: 24px; flex: none; color: var(--text); margin-top: 2px }
.delivery strong { color: var(--text); font-weight: 600 }
.delivery .ok { color: var(--ok) } .delivery .warn { color: var(--badge-warn) }
.desc { margin: 0 }
details.acc { border-top: 1px solid var(--line) }
details.acc:last-of-type { border-bottom: 1px solid var(--line) }
details.acc summary { cursor: pointer; padding: 14px 0; color: var(--text); list-style: none; display: flex; justify-content: space-between }
details.acc summary::-webkit-details-marker { display: none }
details.acc summary::after { content: "+"; font-size: 20px; line-height: 1 }
details.acc[open] summary::after { content: "−" }
details.acc div { padding-bottom: 16px; font-size: 15px }
.notice { font-size: 14px; padding: 12px 14px; background: #FBEFEF; color: #8E1F2C }

/* cart drawer */
.overlay { position: fixed; inset: 0; background: rgba(18,18,18,.5); z-index: 50 }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(400px, 100vw); background: var(--bg); z-index: 51; display: grid; grid-template-rows: auto 1fr auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px) }
.drawer__head { display: flex; justify-content: space-between; align-items: center; padding: 20px 24px 14px }
.drawer__head h2 { font-size: 24px }
.drawer__items { overflow-y: auto; padding: 0 24px; border-top: 1px solid var(--line) }
.ship-bar { padding: 14px 24px 0; font-size: 14px }
.ship-bar .track { height: 4px; background: var(--line); margin-top: 6px }
.ship-bar .track i { display: block; height: 100%; background: var(--text) }
.item { display: grid; grid-template-columns: 90px 1fr; gap: 16px; padding: 20px 0; border-bottom: 1px solid var(--line); min-width: 0 }
.item .media { aspect-ratio: 1; background: var(--media) }
.item .media svg { width: 100%; height: 100%; display: block }
.item a { color: var(--text); text-decoration: none; font-size: 15px; line-height: 1.4 }
.item a:hover { text-decoration: underline }
.item dl { margin: 2px 0 6px; font-size: 13px; color: var(--soft); line-height: 1.5 }
.item dd { margin: 0 }
.item .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap }
.item .qty { width: 120px; min-height: 38px }
.item .qty button { height: 38px; font-size: 16px }
.remove { border: 0; background: none; cursor: pointer; padding: 6px; color: var(--soft) }
.remove svg { width: 16px; height: 16px; display: block }
.item .note { font-size: 12.5px; color: var(--badge-warn); margin-top: 4px; line-height: 1.4 }
.drawer__foot { border-top: 1px solid var(--line); padding: 18px 24px 22px; display: grid; gap: 10px }
.totals { display: flex; justify-content: space-between; align-items: baseline; color: var(--text); font-size: 16px }
.totals .price { font-size: 18px }
.drawer__foot small { font-size: 13px; color: var(--soft); line-height: 1.5 }
.drawer .empty-cart { padding: 60px 0; text-align: center; display: grid; gap: 16px; justify-items: center }

/* footer */
footer.site { border-top: 1px solid var(--line); margin-top: 20px }
.footer-top { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 30px; padding-block: 44px 30px }
.footer-top h3 { font-size: 18px; margin-bottom: 12px }
.footer-top ul { list-style: none; margin: 0; padding: 0 }
.footer-top li a { color: var(--soft); text-decoration: none; font-size: 15px; line-height: 2 }
.footer-top li a:hover { color: var(--text); text-decoration: underline }
.footer-top p { margin: 0; font-size: 15px }
.footer-bottom { border-top: 1px solid var(--line); padding-block: 20px 30px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 14px; font-size: 12px; color: var(--soft) }
.pay { display: flex; gap: 6px; flex-wrap: wrap }
.pay span { border: 1px solid var(--line); border-radius: 3px; padding: 0 8px; font-size: 11px; line-height: 22px; color: var(--text) }

.policy { max-width: 760px; padding-block: 40px 60px }
.policy h1 { margin-bottom: 20px }
.policy h2 { font-size: 20px; margin: 28px 0 6px }

.toast { position: fixed; top: calc(90px + env(safe-area-inset-top, 0px)); right: max(20px, env(safe-area-inset-right, 0px)); background: var(--bg); border: 1px solid var(--line); box-shadow: 0 6px 20px rgba(0,0,0,.12); padding: 14px 18px; z-index: 45; font-size: 14px; color: var(--text); display: flex; gap: 10px; align-items: center }
.toast svg { width: 16px; height: 16px; color: var(--ok) }

@media (max-width: 989px) {
  .page-width { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
  .menu { display: none }
  .burger { display: grid }
  .header { grid-template-columns: auto 1fr auto; padding-block: 10px }
  .logo { justify-self: center; font-size: 22px }
  .banner .page-width { grid-template-columns: 1fr; min-height: 0; text-align: center; padding-block: 30px 36px }
  .collage { justify-self: center; max-width: 420px; order: -1 }
  .banner h1 { font-size: 34px } .banner p { margin-inline: auto }
  .banner .btns { justify-content: center }
  .collections, .product-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 10px }
  .iwt .page-width { grid-template-columns: 1fr; padding-left: 0; padding-right: 0 }
  .iwt .content { padding: 30px max(16px, env(safe-area-inset-left, 0px)) }
  .multicolumn { grid-template-columns: 1fr }
  .product { grid-template-columns: 1fr; gap: 24px; padding-block: 16px 40px }
  .product .info { position: static }
  .product h1 { font-size: 30px }
  h1 { font-size: 30px }
  .facets .count { margin-left: 0 }
  .toast { left: 16px; right: 16px }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>
</head>
<body>
<div class="announcement" id="announce"></div>

<div class="header-wrapper">
  <header class="header page-width">
    <button class="icon-btn burger" id="burger" aria-label="Menu" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
    <a class="logo" href="#" id="logo"></a>
    <nav class="menu" aria-label="Main">
      <a href="#" data-nav="home">Home</a>
      <a href="#shop-all" data-nav="shop-all">Shop all</a>
      <details id="holMenu"><summary>Holidays ▾</summary><div id="holLinks"></div></details>
      <a href="#policies" data-nav="policies">Shipping &amp; returns</a>
    </nav>
    <div class="icons">
      <button class="icon-btn" id="searchBtn" aria-label="Search" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
      <button class="icon-btn" id="cartBtn" aria-label="Cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 7h14l-1.2 12.2a1 1 0 0 1-1 .8H7.2a1 1 0 0 1-1-.8L5 7z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/></svg>
        <span class="bubble" id="cartCount" hidden></span></button>
    </div>
  </header>
  <div class="searchbar" id="searchbar" hidden><div class="page-width"><label class="field"><span class="visually-hidden">Search</span><input id="q" type="search" placeholder="Search"></label></div></div>
  <nav class="mobile-nav" id="mobileNav" hidden aria-label="Mobile"><div class="page-width" id="mobileLinks"></div></nav>
</div>

<main id="main"></main>

<footer class="site">
  <div class="footer-top page-width">
    <div><h3>Shop</h3><ul id="footShop"></ul></div>
    <div><h3>Help</h3><ul><li><a href="#policies">Shipping</a></li><li><a href="#policies">Returns &amp; replacements</a></li><li><a href="#policies">Order deadlines</a></li></ul></div>
    <div><h3 id="footAboutH"></h3><p id="footAbout"></p></div>
  </div>
  <div class="footer-bottom page-width">
    <div class="pay" aria-label="Payment methods"><span>Visa</span><span>Mastercard</span><span>Amex</span><span>Discover</span><span>Apple Pay</span><span>Google Pay</span></div>
    <span id="copy"></span>
  </div>
</footer>

<div class="overlay" id="overlay" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Your cart"></aside>
<div class="toast" id="toast" hidden role="status"></div>

<script type="module">
import { CONFIG, OCCASIONS, COLORS, TYPES, PRODUCTS, optionPrice, sku, parseSku, optionsOf, optionLabel, specOf, typeLabel,
  arrival, fitFor, orderBy, parseDate, todayLocal } from "./catalog.js";
import { mockup } from "./mockups.js";

// Product photos made by Printful (scripts/printful-sync.mjs). Until they exist, products show drawn previews.
let PHOTOS = {};
try { const r = await fetch("images/manifest.json"); if (r.ok) PHOTOS = await r.json(); } catch {}

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const usd = (n) => "$" + Number(n).toFixed(2);
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const fmt = (d) => `${MON[d.getUTCMonth()]} ${d.getUTCDate()}`;
const occ = Object.fromEntries(OCCASIONS.map((o) => [o.id, o]));
const TODAY = todayLocal();
const NAME = CONFIG.storeName;
const hasCJ = PRODUCTS.some((p) => p.supplier === "cj");
function photosOf(p, color, option) {
  if (p.supplier === "cj") { const v = option && p.optionPhotos && p.optionPhotos[option]; return [...(v ? [v] : []), ...(p.photos || [])]; }
  return PHOTOS[`${p.id}.${color}`] || [];
}
function pic(p, color, i = 0, option) {
  const ph = photosOf(p, color, option);
  if (ph[i]) return `<img src="${esc(ph[i])}" alt="${esc(p.name)}${p.colors.length > 1 ? ", " + esc(COLORS[color].name) : ""}" loading="lazy">`;
  if (i > 0) return "";
  return p.supplier === "cj" ? `<span class="noimg">${esc(p.name)}</span>` : mockup(p, color);
}

// Holidays still ahead (ending today or later), in date order.
const upcoming = OCCASIONS.filter((o) => parseDate(o.end || o.date) >= TODAY);
const nextDeadline = upcoming.filter((o) => !o.season && orderBy(o) >= TODAY)[0];

// ------------------------------------------------------------ cart
let cart = [];
try { cart = JSON.parse(localStorage.getItem("ee-cart") || "[]").filter((l) => parseSku(l.sku)); } catch { cart = []; }
const saveCart = () => { try { localStorage.setItem("ee-cart", JSON.stringify(cart)); } catch {} };
const count = () => cart.reduce((a, l) => a + l.qty, 0);
function drawCount() { const n = count(), b = $("#cartCount"); b.textContent = n; b.hidden = !n; }

// ------------------------------------------------------------ helpers
const minPrice = (p) => Math.min(...optionsOf(p).map((o) => optionPrice(p, o)));
const ranged = (p) => optionsOf(p).some((o) => optionPrice(p, o) !== minPrice(p));
function status(p, targetDate) {
  const o = occ[p.occasion];
  const date = targetDate || (o.season ? null : parseDate(o.date));
  return date ? fitFor(p.type, date) : "in";
}
function badge(p) {
  const st = status(p), o = occ[p.occasion];
  if (st === "tight") return `<span class="badge">Order soon</span>`;
  if (st === "late") return `<span class="badge light">Ships after ${esc(o.name)}</span>`;
  return "";
}
function card(p) {
  const c0 = p.colors[0], alt = pic(p, c0, 1) || (p.colors[1] ? pic(p, p.colors[1]) : "");
  return `<li class="card">
    <div class="media">${pic(p, c0)}${alt ? `<div class="alt">${alt}</div>` : ""}${badge(p)}</div>
    <a class="card__title" href="#${p.id}">${esc(p.name)}</a>
    <div class="price">${ranged(p) ? "From " : ""}${usd(minPrice(p))}</div></li>`;
}
const grid = (list) => `<ul class="product-grid">${list.map(card).join("")}</ul>`;
const arrowSvg = `<svg class="arrow" viewBox="0 0 14 10" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M0 5h13M9 1l4 4-4 4"/></svg>`;

const facet = { type: "", by: "", sort: "featured" };
function viewCollection(id) {
  const o = occ[id];
  const base = o ? PRODUCTS.filter((p) => p.occasion === id) : PRODUCTS;
  let list = base.filter((p) => !facet.type || p.type === facet.type);
  if (facet.by) { const t = parseDate(occ[facet.by].date); list = list.filter((p) => fitFor(p.type, t) === "in"); }
  if (facet.sort === "low") list = [...list].sort((a, b) => minPrice(a) - minPrice(b));
  if (facet.sort === "high") list = [...list].sort((a, b) => minPrice(b) - minPrice(a));
  if (facet.sort === "az") list = [...list].sort((a, b) => a.name.localeCompare(b.name));
  const types = [...new Set(base.map((p) => p.type))];
  const d = o && parseDate(o.date);
  const intro = o ? (o.season ? o.note : `${o.note} Order by ${fmt(orderBy(o))} for standard delivery.`) : "Every product in the shop, from fall through the first days of 2027.";
  return `<div class="page-width">
    <div class="collection-hero">${o ? `<span class="eyebrow">${DOW[d.getUTCDay()]}, ${fmt(d)}${o.end ? ` – ${fmt(parseDate(o.end))}` : ""}</span>` : ""}<h1>${o ? esc(o.name) : "Products"}</h1><p>${esc(intro)}</p></div>
    <div class="facets">
      <label for="fType">Product type <select id="fType"><option value="">All</option>${types.map((t) => `<option value="${t}"${facet.type === t ? " selected" : ""}>${TYPES[t].label}</option>`).join("")}</select></label>
      <label for="fBy">Arrives by <select id="fBy"><option value="">Any date</option>${upcoming.filter((x) => !x.season).map((x) => `<option value="${x.id}"${facet.by === x.id ? " selected" : ""}>${esc(x.name)} (${fmt(parseDate(x.date))})</option>`).join("")}</select></label>
      <label for="fSort">Sort by <select id="fSort">${[["featured", "Featured"], ["az", "Alphabetically, A-Z"], ["low", "Price, low to high"], ["high", "Price, high to low"]].map(([v, l]) => `<option value="${v}"${facet.sort === v ? " selected" : ""}>${l}</option>`).join("")}</select></label>
      <span class="count">${list.length} product${list.length === 1 ? "" : "s"}</span>
    </div>
    ${list.length ? grid(list) : `<p class="empty">No products match those filters. <a class="link" href="#shop-all" data-reset>Clear filters</a></p>`}
    <div style="height:50px"></div></div>`;
}

let pv = null;
function viewProduct(p) {
  const opts = optionsOf(p);
  if (!pv || pv.p !== p) pv = { p, color: p.colors[0], option: opts.includes("M") ? "M" : opts[0], qty: 1, msg: "", img: 0 };
  return `<div class="page-width"><div class="product">
    <div class="gallery">${gallery()}</div>
    <div class="info">${productInfo()}</div></div>
    <section style="padding-block:20px 50px"><div class="title-wrapper"><h2>You may also like</h2></div>
    ${grid(PRODUCTS.filter((x) => x.occasion === p.occasion && x.id !== p.id).concat(PRODUCTS.filter((x) => x.design === p.design && x.occasion !== p.occasion)).slice(0, 4))}</section></div>`;
}
function gallery() {
  const { p, color, option } = pv, ph = photosOf(p, color, option), i = Math.min(pv.img || 0, Math.max(0, ph.length - 1));
  const main = ph.length ? pic(p, color, i, option) : pic(p, color);
  const thumbs = ph.length > 1
    ? ph.map((src, k) => `<button data-img="${k}" aria-current="${k === i}" aria-label="Image ${k + 1}"><img src="${esc(src)}" alt="" loading="lazy"></button>`).join("")
    : !ph.length && p.colors.length > 1 ? p.colors.map((c) => `<button data-color="${c}" aria-current="${c === color}" aria-label="${COLORS[c].name}">${pic(p, c)}</button>`).join("") : "";
  return `<div class="main">${main}</div>${thumbs ? `<div class="thumbs">${thumbs}</div>` : ""}`;
}
function productInfo() {

      : b !== "late" ? `<br><span class="warn">Choose express at checkout for the best chance of arriving by ${esc(o.name)}.</span>`

    ${opts.length > 1 ? `<fieldset><legend>${esc(optionLabel(p))}</legend><div class="pills">${opts.map((op) => `<button class="pill" data-opt="${esc(op)}" aria-pressed="${op === option}">${esc(op)}</button>`).join("")}</div></fieldset>` : ""}
    <div><div style="font-size:14px;color:var(--text);margin-bottom:8px">Quantity</div>
      <div class="qty"><button data-q="-1" aria-label="Decrease quantity">−</button><span>${qty}</span><button data-q="1" aria-label="Increase quantity">+</button></div></div>
    <div class="buy"><button class="button button--secondary" id="addBtn">Add to cart</button><button class="button" id="buyNow">Buy it now</button></div>
    ${msg}
    <div class="delivery"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 6h12v10H2zM14 9h5l3 4v3h-8z"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg>
      <div><strong>Estimated delivery ${fmt(std.early)} – ${fmt(std.late)}</strong><br>Express: ${fmt(exp.early)} – ${fmt(exp.late)}${fit}</div></div>
    <p class="desc">${esc(p.blurb)}</p>
    <div>
      <details class="acc"><summary>${p.supplier === "cj" ? "Details" : "Materials &amp; care"}</summary><div>${esc(specOf(p))}</div></details>
      <details class="acc"><summary>Shipping</summary><div>${p.supplier === "cj" ? `Ships from a US warehouse within ${t.prod[0]}–${t.prod[1]} business days.` : `Made to order in ${t.prod[0]}–${t.prod[1]} business days, then shipped to US addresses.`} Standard shipping is ${usd(CONFIG.shipping.standard.cents / 100)}, free on orders over ${usd(CONFIG.shipping.standard.freeOverCents / 100)}. Express is ${usd(CONFIG.shipping.express.cents / 100)}.</div></details>
      <details class="acc"><summary>Returns &amp; replacements</summary><div>If your item arrives damaged or misprinted, email a photo within 30 days of delivery and we’ll replace it or refund it. Because each piece is made to order, we can’t accept returns for size or change of mind.</div></details>

    <h2>Returns &amp; replacements</h2><p>If an item arrives damaged, defective or misprinted, email a photo within 30 days of delivery and we’ll send a replacement or refund it. Because each piece is printed for you, we can’t accept returns or exchanges for size or change of mind. Please check the size details before ordering.</p>

// ------------------------------------------------------------ router
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  const p = PRODUCTS.find((x) => x.id === h);
  let html, nav = "";
  if (p) html = viewProduct(p);
  else if (occ[h] || h === "shop-all") { html = viewCollection(occ[h] ? h : ""); nav = "shop-all"; }
  else if (h === "policies") { html = viewPolicies(); nav = "policies"; }
  else { html = viewHome(); nav = "home"; }
  $("#main").innerHTML = html;
  document.querySelectorAll("[data-nav]").forEach((a) => a.dataset.nav === nav ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  document.title = p ? `${p.name} – ${NAME}` : occ[h] ? `${occ[h].name} – ${NAME}` : NAME;
  $("#holMenu").open = false; closeMobile();
}
let lastHash = location.hash;
window.addEventListener("hashchange", () => {
  const prev = lastHash; lastHash = location.hash;
  const isColl = occ[location.hash.slice(1)] || location.hash === "#shop-all";
  if (isColl && prev !== location.hash) Object.assign(facet, { type: "", by: "", sort: "featured" });
  $("#q").value = "";
  route(); window.scrollTo(0, 0);
});

// ------------------------------------------------------------ page events
$("#main").addEventListener("change", (e) => {
  if (e.target.id === "fType") facet.type = e.target.value;
  else if (e.target.id === "fBy") facet.by = e.target.value;
  else if (e.target.id === "fSort") facet.sort = e.target.value;
  else return;
  const y = window.scrollY; route(); window.scrollTo(0, y);
});
$("#main").addEventListener("click", (e) => {
  if (e.target.closest("[data-reset]")) { Object.assign(facet, { type: "", by: "", sort: "featured" }); }
  if (!pv || !e.target.closest(".product")) return;
  const c = e.target.closest("[data-color]"), op = e.target.closest("[data-opt]"), q = e.target.closest("[data-q]");
  const im = e.target.closest("[data-img]");
  if (im) { pv.img = Number(im.dataset.img); $(".gallery").innerHTML = gallery(); return; }
  if (c) { pv.color = c.dataset.color; pv.msg = ""; pv.img = 0; $(".gallery").innerHTML = gallery(); }
  else if (op) { pv.option = op.dataset.opt; pv.msg = ""; if (pv.p.supplier === "cj") { pv.img = 0; $(".gallery").innerHTML = gallery(); } }
  else if (q) pv.qty = Math.max(1, Math.min(CONFIG.maxQtyPerLine, pv.qty + Number(q.dataset.q)));
  else if (e.target.closest("#addBtn")) { addToCart(sku(pv.p.id, pv.color, pv.option), pv.qty); openCart(); return; }
  else if (e.target.closest("#buyNow")) { return checkout([{ sku: sku(pv.p.id, pv.color, pv.option), qty: pv.qty }], e.target.closest("#buyNow"), (m) => { pv.msg = m; $(".product .info").innerHTML = productInfo(); }); }
  else return;
  $(".product .info").innerHTML = productInfo();
});

// ------------------------------------------------------------ cart drawer
function addToCart(s, n) {
  const l = cart.find((x) => x.sku === s);
  if (l) l.qty = Math.min(CONFIG.maxQtyPerLine, l.qty + n); else cart.push({ sku: s, qty: n });
  saveCart(); drawCount();
}
let cartMsg = "";
function openCart() { $("#drawer").hidden = false; $("#overlay").hidden = false; drawCart(); document.body.style.overflow = "hidden"; $("#drawer .icon-btn")?.focus(); }
function closeCart() { $("#drawer").hidden = true; $("#overlay").hidden = true; cartMsg = ""; document.body.style.overflow = ""; }
function drawCart() {
  const lines = cart.map((l) => ({ ...l, v: parseSku(l.sku) }));
  const sub = lines.reduce((a, l) => a + l.v.unitCents * l.qty, 0);
  const free = CONFIG.shipping.standard.freeOverCents, left = free - sub;
  $("#drawer").innerHTML = `<div class="drawer__head"><h2>Your cart</h2><button class="icon-btn" data-close aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  ${lines.length ? `<div><div class="ship-bar">${left > 0 ? `You’re ${usd(left / 100)} away from free shipping.` : "Your order ships free."}<div class="track"><i style="width:${Math.min(100, (sub / free) * 100)}%"></i></div></div>
  <div class="drawer__items" style="margin-top:14px">${lines.map((l) => {
    const p = l.v.product, st = status(p), o = occ[p.occasion];
    return `<div class="item"><a class="media" href="#${p.id}" data-close>${pic(p, l.v.color, 0, l.v.option)}</a>
      <div style="min-width:0"><a href="#${p.id}" data-close>${esc(p.name)}</a>
        <div class="price" style="font-size:14px">${usd(l.v.unitCents / 100)}</div>
        <dl>${p.colors.length > 1 ? `<dt class="visually-hidden">Color</dt><dd>Color: ${COLORS[l.v.color].name}</dd>` : ""}${optionsOf(p).length > 1 ? `<dd>${esc(optionLabel(p))}: ${esc(l.v.option)}</dd>` : ""}</dl>
        <div class="row"><div class="qty"><button data-lq="-1" data-s="${l.sku}" aria-label="Decrease">−</button><span>${l.qty}</span><button data-lq="1" data-s="${l.sku}" aria-label="Increase">+</button></div>
          <button class="remove" data-rm="${l.sku}" aria-label="Remove ${esc(p.name)}"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M2 4h12M6 4V2h4v2M4 4l1 10h6l1-10"/></svg></button></div>
        ${st !== "in" ? `<div class="note">${st === "tight" ? `Choose express for ${esc(o.name)}` : `Arrives after ${esc(o.name)}`}</div>` : ""}</div></div>`;
  }).join("")}</div></div>
  <div class="drawer__foot"><div class="totals"><span>Estimated total</span><span class="price">${usd(sub / 100)} USD</span></div>
    <small>Taxes, discounts and shipping calculated at checkout.</small>${cartMsg}
    <button class="button" id="checkoutBtn">Check out</button></div>`
  : `<div class="drawer__items"><div class="empty-cart"><h2>Your cart is empty</h2><a class="button" href="#shop-all" data-close>Continue shopping</a></div></div><div></div>`}`;
}
$("#cartBtn").addEventListener("click", openCart);
$("#overlay").addEventListener("click", closeCart);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#drawer").hidden) closeCart(); });
$("#drawer").addEventListener("click", (e) => {
  if (e.target.closest("[data-close]")) return closeCart();
  const lq = e.target.closest("[data-lq]"), rm = e.target.closest("[data-rm]");
  if (lq) { const l = cart.find((x) => x.sku === lq.dataset.s); l.qty += Number(lq.dataset.lq); if (l.qty < 1) cart = cart.filter((x) => x !== l); else l.qty = Math.min(CONFIG.maxQtyPerLine, l.qty); }
  else if (rm) cart = cart.filter((x) => x.sku !== rm.dataset.rm);
  else if (e.target.closest("#checkoutBtn")) return checkout(cart, e.target.closest("#checkoutBtn"), (m) => { cartMsg = m; drawCart(); });
  else return;
  saveCart(); drawCount(); drawCart();
});

const NOT_CONNECTED = "Checkout opens once the store is live with payments connected. This preview can’t take orders.";
async function checkout(items, btn, show) {
  btn.disabled = true; const label = btn.textContent; btn.textContent = "Loading…";
  try {
    const r = await fetch("/api/checkout", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ items: items.map((l) => ({ sku: l.sku, qty: l.qty })) }) });
    const j = await r.json().catch(() => null);
    if (r.ok && j && j.url) { window.location.assign(j.url); return; }
    show(`<div class="notice">${esc((j && j.error) || NOT_CONNECTED)}</div>`);
  } catch { show(`<div class="notice">${NOT_CONNECTED}</div>`); }
  btn.disabled = false; btn.textContent = label;
}

// ------------------------------------------------------------ header bits
function closeMobile() { $("#mobileNav").hidden = true; $("#burger").setAttribute("aria-expanded", "false"); }
$("#burger").addEventListener("click", () => { const n = $("#mobileNav"); n.hidden = !n.hidden; $("#burger").setAttribute("aria-expanded", String(!n.hidden)); });
$("#searchBtn").addEventListener("click", () => { const s = $("#searchbar"); s.hidden = !s.hidden; $("#searchBtn").setAttribute("aria-expanded", String(!s.hidden)); if (!s.hidden) $("#q").focus(); });
$("#q").addEventListener("input", (e) => {
  const q = e.target.value.trim().toLowerCase();
  if (!q) { route(); return; }
  const list = PRODUCTS.filter((p) => [p.name, occ[p.occasion].name, typeLabel(p), p.blurb].join(" ").toLowerCase().includes(q));
  $("#main").innerHTML = `<div class="page-width"><div class="collection-hero"><h1>Search results</h1><p>${list.length} result${list.length === 1 ? "" : "s"} for “${esc(e.target.value)}”</p></div><div style="height:24px"></div>${list.length ? grid(list) : ""}<div style="height:50px"></div></div>`;
});
document.addEventListener("click", (e) => { const d = $("#holMenu"); if (d.open && !d.contains(e.target)) d.open = false; });

const holLinks = upcoming.map((o) => `<a href="#${o.id}">${esc(o.name)}</a>`).join("");
$("#holLinks").innerHTML = holLinks;
$("#mobileLinks").innerHTML = `<a href="#">Home</a><a href="#shop-all">Shop all</a><div class="sub">${holLinks}</div><a href="#policies">Shipping &amp; returns</a>`;
$("#footShop").innerHTML = `<li><a href="#shop-all">Shop all</a></li>` + upcoming.map((o) => `<li><a href="#${o.id}">${esc(o.name)}</a></li>`).join("");
$("#logo").textContent = NAME;
$("#footAboutH").textContent = `About ${NAME}`;
$("#footAbout").textContent = `Made-to-order gifts for every celebration of the season, printed in the US. ${NAME} is operated by ${CONFIG.operator}.`;
$("#copy").textContent = `© ${TODAY.getUTCFullYear()}, ${NAME}`;
$("#announce").textContent = nextDeadline
  ? `Free shipping on orders over ${usd(CONFIG.shipping.standard.freeOverCents / 100).replace(".00", "")} · Order by ${fmt(orderBy(nextDeadline))} for ${nextDeadline.name}`
  : `Free shipping on orders over ${usd(CONFIG.shipping.standard.freeOverCents / 100).replace(".00", "")}`;

if (new URLSearchParams(location.search).get("order") === "success") {
  cart = []; saveCart();
  const t = $("#toast"); t.innerHTML = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8l3 3 7-7"/></svg>Thank you! Your order is confirmed. A receipt is on its way to your email.`;
  t.hidden = false; setTimeout(() => (t.hidden = true), 8000);
}
route(); drawCount();
</script>
</body>
</html>
